<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Tour - FootballHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .tour-modal {
            background: #252842;
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.4s ease;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tour-icon {
            width: 100px;
            height: 100px;
            background: #ff0032;
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 8px 24px rgba(255, 0, 50, 0.3);
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        p {
            color: #8b8fa8;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 1.125rem;
        }

        .progress-dots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3d5c;
            transition: all 0.3s;
        }

        .dot.active {
            background: #ff0032;
            width: 24px;
            border-radius: 4px;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #ff0032;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #e6002d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 50, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #8b8fa8;
            border: 2px solid transparent;
        }

        .btn-secondary:hover {
            color: #ffffff;
        }

        .step-counter {
            color: #8b8fa8;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 640px) {
            .tour-modal {
                padding: 2rem 1.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay">
        <div class="tour-modal">
            <div class="step-counter" id="stepCounter">Step 1 of 5</div>
            
            <div class="tour-icon" id="tourIcon">🏆</div>
            
            <h2 id="tourTitle">Welcome to FootballHub!</h2>
            <p id="tourDescription">Let's take a quick tour to help you get started with your new platform.</p>

            <div class="progress-dots" id="progressDots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="buttons">
                <button class="btn btn-secondary" onclick="skip()">Skip Tour</button>
                <button class="btn btn-primary" onclick="next()">Next</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        let userType = 'player'; // Default to player for demo

        const tours = {
            player: [
                {
                    icon: '🏆',
                    title: 'Welcome to FootballHub!',
                    description: "We're excited to have you here. Let's explore what makes FootballHub perfect for players like you."
                },
                {
                    icon: '📹',
                    title: 'Share Your Highlights',
                    description: 'Upload match videos, training clips, and showcase your skills to scouts and clubs worldwide.'
                },
                {
                    icon: '🤝',
                    title: 'Connect with Scouts',
                    description: 'Get discovered by professional scouts and clubs looking for talent just like you.'
                },
                {
                    icon: '📊',
                    title: 'Track Your Progress',
                    description: 'View your stats, performance analytics, and see how you compare with other players.'
                },
                {
                    icon: '🌟',
                    title: "You're All Set!",
                    description: "Start building your profile, upload content, and take the next step in your football career!"
                }
            ],
            fan: [
                {
                    icon: '❤️',
                    title: 'Welcome Football Fan!',
                    description: "You're about to experience football like never before. Let's get started!"
                },
                {
                    icon: '📺',
                    title: 'Watch Live Matches',
                    description: 'Stream live matches, highlights, and exclusive behind-the-scenes content from your favorite teams.'
                },
                {
                    icon: '💬',
                    title: 'Join the Community',
                    description: 'Chat with fellow fans, comment on posts, and be part of the conversation.'
                },
                {
                    icon: '🎟️',
                    title: 'Get Event Updates',
                    description: 'Never miss a match! Get notifications for upcoming games, events, and exclusive fan experiences.'
                },
                {
                    icon: '⚽',
                    title: 'Let the Games Begin!',
                    description: "Follow your favorite teams, engage with content, and enjoy the beautiful game!"
                }
            ],
            coach: [
                {
                    icon: '👥',
                    title: 'Welcome Coach!',
                    description: 'Manage your team, discover talent, and grow your coaching career with FootballHub.'
                },
                {
                    icon: '🔍',
                    title: 'Scout New Talent',
                    description: 'Browse player profiles, watch highlight reels, and find the perfect additions to your squad.'
                },
                {
                    icon: '📱',
                    title: 'Manage Your Team',
                    description: 'Post updates, share match results, and keep your team engaged with regular content.'
                },
                {
                    icon: '📊',
                    title: 'Training Resources',
                    description: 'Access training drills, tactical analysis, and resources to improve your coaching skills.'
                },
                {
                    icon: '🎯',
                    title: "Let's Build Champions!",
                    description: 'Start managing your team, developing talent, and achieving your coaching goals!'
                }
            ],
            analyst: [
                {
                    icon: '⚡',
                    title: 'Welcome Analyst!',
                    description: 'Dive deep into match data, tactics, and performance analytics with FootballHub.'
                },
                {
                    icon: '🎯',
                    title: 'Advanced Analytics',
                    description: 'Access detailed match statistics, heat maps, and performance metrics for in-depth analysis.'
                },
                {
                    icon: '📊',
                    title: 'Track Trends',
                    description: 'Monitor player performance, team tactics, and league trends with comprehensive data tools.'
                },
                {
                    icon: '🤝',
                    title: 'Share Insights',
                    description: 'Publish your analysis, connect with other analysts, and contribute to the football community.'
                },
                {
                    icon: '🚀',
                    title: 'Ready to Analyze!',
                    description: 'Start exploring data, creating insights, and making your mark in football analysis!'
                }
            ]
        };

        // Get user role from profile
        function getUserRole() {
            const userData = sessionStorage.getItem('footballhub_user');
            if (userData) {
                const user = JSON.parse(userData);
                return user.role || 'fan'; // Default to fan if no role specified
            }
            return 'fan';
        }

        userType = getUserRole();
        const steps = tours[userType] || tours.fan;

        function updateTour() {
            const step = steps[currentStep];
            document.getElementById('stepCounter').textContent = `Step ${currentStep + 1} of ${steps.length}`;
            document.getElementById('tourIcon').textContent = step.icon;
            document.getElementById('tourTitle').textContent = step.title;
            document.getElementById('tourDescription').textContent = step.description;

            // Update dots
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentStep);
            });

            // Update button
            const nextBtn = document.querySelector('.btn-primary');
            nextBtn.textContent = currentStep === steps.length - 1 ? "Let's Go!" : 'Next';
        }

        function next() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateTour();
            } else {
                complete();
            }
        }

        function skip() {
            complete();
        }

        function complete() {
            // Mark tour as completed
            sessionStorage.setItem('footballhub_tour_completed', 'true');
            
            // Redirect to home page
            window.location.href = 'home.html';
        }

        // Check if user should see this tour
        window.onload = function() {
            const user = sessionStorage.getItem('footballhub_user');
            const profileCompleted = sessionStorage.getItem('footballhub_profile_completed');
            const tourCompleted = sessionStorage.getItem('footballhub_tour_completed');
            
            if (!user || profileCompleted !== 'true') {
                // User hasn't completed registration/profile
                window.location.href = 'index.html';
            } else if (tourCompleted === 'true') {
                // User already saw the tour
                window.location.href = 'home.html';
            }
        };

        // Initialize
        updateTour();
    </script>
</body>
</html>
