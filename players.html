
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Scout Discovery | LiveScore</title>
    <style>
      /* CSS Variables - Ludisco Colors */
:root {
    --primary-red: #D90D32;
    --navy-blue: #020F59;
    --dark-blue: #023373;
    --medium-blue: #023E73;
    --light-bg: #F2F2F2;
    --text-dark: #1a1a2e;
    --text-light: #ffffff;
    --text-muted: #d9dbe3;
}

/* General Reset */
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #020F59 0%, #023373 50%, #023E73 100%);
    color: var(--text-light);
    min-height: 100vh;
    padding-top: 80px;
}

/* Navigation Bar - STICKY */
.horizontal-nav {
    background: linear-gradient(135deg, #020F59 0%, #023373 100%);
    border-bottom: 2px solid #D90D32;
    padding: 15px 25px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
    gap: 20px;
    flex-wrap: wrap;
}

.logo {
    font-weight: bold;
    font-size: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    flex-shrink: 0;
}

.logo i {
    color: #D90D32;
    font-size: 28px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-5px); }
    60% { transform: translateY(-3px); }
}

.nav-links {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    border-radius: 8px;
    transition: all 0.3s ease;
    font-weight: 500;
    position: relative;
    white-space: nowrap;
}

.nav-link:hover {
    color: white;
    background: rgba(217, 13, 50, 0.15);
}

.nav-link.active {
    color: #D90D32;
    background: rgba(217, 13, 50, 0.2);
}

.nav-link.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: #D90D32;
    border-radius: 2px 2px 0 0;
}

/* Search Bar */
.search-bar {
    display: flex;
    flex: 1;
    max-width: 350px;
    min-width: 250px;
    position: relative;
    flex-shrink: 0;
}

.search-bar input {
    flex: 1;
    padding: 12px 50px 12px 20px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 25px;
    outline: none;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 14px;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.search-bar input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

.search-bar input:focus {
    border-color: #D90D32;
    background: rgba(255, 255, 255, 0.15);
    transform: scale(1.01);
    box-shadow: 0 0 20px rgba(217, 13, 50, 0.3);
}

.search-bar button {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    background: linear-gradient(135deg, #D90D32, #b00a28);
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
    font-size: 16px;
}

.search-bar button:hover {
    background: linear-gradient(135deg, #b00a28, #8a0820);
    transform: translateY(-50%) scale(1.1);
}

/* Top Icons */
.top-icons {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 22px;
    flex-shrink: 0;
}

.top-icons > i {
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 8px;
    border-radius: 50%;
}

.top-icons > i:hover {
    color: #D90D32;
    background: rgba(217, 13, 50, 0.15);
    transform: scale(1.2);
}

/* Content Area */
.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

h1 {
    font-size: 2em;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #D90D32, #ff4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    color: var(--text-muted);
    margin-bottom: 30px;
    font-size: 1.1em;
}

.players {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.player-card {
    background: linear-gradient(145deg, #020F59 0%, #023373 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.player-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 50px rgba(217, 13, 50, 0.4);
    border-color: #D90D32;
}

.player-image-container {
    position: relative;
    height: 220px;
    background: linear-gradient(135deg, #023373, #023E73);
    overflow: hidden;
}

.player-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.player-card:hover .player-image {
    transform: scale(1.1);
}

.player-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: linear-gradient(135deg, #D90D32, #b00a28);
    color: white;
    padding: 6px 12px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 3px 12px rgba(217, 13, 50, 0.4);
}

.position-badge {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.player-content {
    padding: 18px;
}

.player-info h3 {
    margin: 0 0 8px 0;
    color: white;
    font-size: 1.2em;
    font-weight: 700;
}

.player-info p {
    color: var(--text-muted);
    font-size: 0.85em;
    margin: 4px 0;
    display: flex;
    align-items: center;
    gap: 6px;
}

.player-info i {
    color: #D90D32;
    font-size: 13px;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin: 15px 0;
    padding: 12px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.stats div {
    text-align: center;
}

.stats span {
    display: block;
    font-weight: bold;
    color: white;
    font-size: 1.2em;
    margin-bottom: 4px;
}

.stats small {
    color: var(--text-muted);
    font-size: 0.8em;
}

.skills {
    margin-top: 12px;
}

.skill-item {
    margin-bottom: 10px;
}

.skill-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 0.85em;
}

.skill-label span:first-child {
    color: var(--text-muted);
}

.skill-label span:last-child {
    color: white;
    font-weight: bold;
}

.bar {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    height: 6px;
}

.bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #D90D32, #ff4444);
    border-radius: 10px;
    transition: width 0.6s ease;
    box-shadow: 0 0 10px rgba(217, 13, 50, 0.5);
}

.player-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.action-btn {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85em;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.btn-primary {
    background: linear-gradient(135deg, #D90D32, #b00a28);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(217, 13, 50, 0.4);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
}

/* Modal Styles */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s ease;
    padding: 20px;
}

.modal-overlay.show {
    opacity: 1;
}

.profile-modal, .contact-modal {
    background: linear-gradient(145deg, #020F59, #023373);
    border-radius: 20px;
    max-width: 900px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    border: 2px solid #D90D32;
    animation: slideUp 0.3s ease;
}

.contact-modal {
    max-width: 600px;
}

@keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 25px;
    border-bottom: 2px solid #D90D32;
    position: sticky;
    top: 0;
    background: linear-gradient(145deg, #020F59, #023373);
    z-index: 10;
}

.modal-header-bar h2 {
    font-size: 24px;
    background: linear-gradient(135deg, #D90D32, #ff4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

.close-modal {
    cursor: pointer;
    font-size: 28px;
    color: #b8b8c8;
    transition: all 0.3s ease;
    padding: 5px;
}

.close-modal:hover {
    color: #D90D32;
    transform: rotate(90deg);
}

.profile-content {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 30px;
    padding: 30px;
}

.profile-image {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.profile-rating-large {
    position: absolute;
    top: 15px;
    right: 15px;
    background: linear-gradient(135deg, #D90D32, #b00a28);
    color: white;
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 24px;
    box-shadow: 0 4px 15px rgba(217, 13, 50, 0.5);
}

.profile-image-section {
    position: relative;
}

.profile-info-section h2 {
    font-size: 32px;
    margin-bottom: 15px;
    color: white;
}

.profile-detail {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    color: var(--text-muted);
    font-size: 16px;
}

.profile-detail i {
    color: #D90D32;
    font-size: 20px;
}

.profile-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.profile-stat-box {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
}

.profile-stat-box:hover {
    background: rgba(217, 13, 50, 0.1);
    border-color: #D90D32;
    transform: translateY(-3px);
}

.profile-stat-box i {
    font-size: 28px;
    color: #D90D32;
    margin-bottom: 10px;
}

.stat-value {
    display: block;
    font-size: 28px;
    font-weight: bold;
    color: white;
    margin: 5px 0;
}

.stat-label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
}

.profile-skills-detailed {
    margin-top: 25px;
}

.profile-skills-detailed h3 {
    margin-bottom: 15px;
    color: white;
    font-size: 18px;
}

.profile-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.contact-content {
    padding: 30px;
}

.contact-player-info {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    margin-bottom: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.contact-player-image {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.contact-player-info h3 {
    margin: 0;
    color: white;
    font-size: 20px;
}

.contact-player-info p {
    margin: 5px 0 0 0;
    color: var(--text-muted);
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    color: #b8b8c8;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
}

.form-group label i {
    color: #D90D32;
    font-size: 18px;
}

.form-group input,
.form-group textarea {
    padding: 12px 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 14px;
    transition: all 0.3s ease;
    font-family: inherit;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #D90D32;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 15px rgba(217, 13, 50, 0.3);
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.full-width {
    width: 100%;
    margin-top: 10px;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: rgba(2, 15, 89, 0.3);
}

::-webkit-scrollbar-thumb {
    background: rgba(217, 13, 50, 0.6);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: #D90D32;
}

/* Responsive Design */
@media (max-width: 768px) {
    .profile-content {
        grid-template-columns: 1fr;
    }
    
    .nav-container {
        flex-direction: column;
    }
    
    .search-bar {
        max-width: 100%;
        width: 100%;
    }
}
    </style>
</head>
<body>

    <!-- NAVIGATION BAR - CLEAN & STATIC -->
    <nav class="horizontal-nav">
        <div class="nav-container">
            <div class="logo">
                
                <span>⚽ LiveScore</span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search players, clubs, positions..." onkeyup="searchPlayer()">
                <button onclick="performSearch()">
                    <i class='bx bx-search'></i>
                </button>
            </div>
            <div class="nav-links">
                <a href="home.html" class="nav-link">Home</a>
                <a href="highlights.html" class="nav-link">Highlights</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="players.html" class="nav-link active">Players</a>
                <a href="sponsors.html" class="nav-link">Sponsors</a>
                <a href="search.html" class="nav-link">Search</a>
            </div>

            

            <div class="top-icons">
                <i class='bx bx-bell' title="Notifications" onclick="showNotifications()"></i>
            </div>
        </div>
    </nav>

    

    <div class="container">
        <h1>players Discovery</h1>
        <p class="subtitle">Find and recruit the best football talent in Kenya</p>

        <div class="players" id="playerList"></div>
    </div>

    <script>
        // Player data with face portrait images
        const players = [
            { 
                name: "James Ochieng", 
                age: 22, 
                position: "Forward", 
                club: "Gor Mahia FC", 
                goals: 23, 
                assists: 12, 
                rating: 8.7, 
                speed: 92, 
                skill: 85,
                image: "https://randomuser.me/api/portraits/men/32.jpg"
            },
            { 
                name: "Michael Wanjala", 
                age: 19, 
                position: "Midfielder", 
                club: "Bandari FC", 
                goals: 8, 
                assists: 15, 
                rating: 8.2, 
                speed: 78, 
                skill: 88,
                image: "https://randomuser.me/api/portraits/men/45.jpg"
            },
            { 
                name: "David Kamau", 
                age: 24, 
                position: "Defender", 
                club: "AFC Leopards", 
                goals: 3, 
                assists: 7, 
                rating: 8.5, 
                speed: 75, 
                skill: 80,
                image: "https://randomuser.me/api/portraits/men/67.jpg"
            },
            { 
                name: "Brian Omondi", 
                age: 21, 
                position: "Winger", 
                club: "Ulinzi Stars", 
                goals: 14, 
                assists: 18, 
                rating: 8.4, 
                speed: 94, 
                skill: 82,
                image: "https://randomuser.me/api/portraits/men/54.jpg"
            },
            { 
                name: "Kevin Otieno", 
                age: 20, 
                position: "Goalkeeper", 
                club: "Tusker FC", 
                goals: 0, 
                assists: 0, 
                rating: 8.0, 
                speed: 70, 
                skill: 86,
                image: "https://randomuser.me/api/portraits/men/78.jpg"
            },
            { 
                name: "Peter Njuguna", 
                age: 23, 
                position: "Striker", 
                club: "Kakamega Homeboyz", 
                goals: 19, 
                assists: 9, 
                rating: 8.3, 
                speed: 88, 
                skill: 83,
                image: "https://randomuser.me/api/portraits/men/23.jpg"
            },
            { 
                name: "Samuel Ouma", 
                age: 25, 
                position: "Midfielder", 
                club: "Sofapaka FC", 
                goals: 11, 
                assists: 14, 
                rating: 8.1, 
                speed: 82, 
                skill: 84,
                image: "https://randomuser.me/api/portraits/men/89.jpg"
            },
            { 
                name: "Eric Kipchoge", 
                age: 22, 
                position: "Defender", 
                club: "Kariobangi Sharks", 
                goals: 2, 
                assists: 5, 
                rating: 7.9, 
                speed: 76, 
                skill: 79,
                image: "https://randomuser.me/api/portraits/men/41.jpg"
            },
        ];

        const playerList = document.getElementById("playerList");

        function displayPlayers(list) {
            if (list.length === 0) {
                 playerList.innerHTML = '<p style="text-align:center; color: var(--muted); grid-column: 1 / -1;">No players matched your search query.</p>';
                 return;
            }

            const playerHTML = list.map(player => `
                <div class="player-card">
                    <div class="player-image-container">
                        <img src="${player.image}" alt="${player.name}" class="player-image">
                        <div class="player-badge">${player.rating}</div>
                        <div class="position-badge">
                            <i class='bx bx-${getPositionIcon(player.position)}'></i> ${player.position}
                        </div>
                    </div>
                    <div class="player-content">
                        <div class="player-header">
                            <div class="player-info">
                                <h3>${player.name}</h3>
                                <p><i class='bx bx-calendar'></i>${player.age} years old</p>
                                <p><i class='bx bx-football'></i>${player.club}</p>
                            </div>
                        </div>
                        <div class="stats">
                            <div>
                                <span>${player.goals}</span>
                                <small>Goals</small>
                            </div>
                            <div>
                                <span>${player.assists}</span>
                                <small>Assists</small>
                            </div>
                        </div>
                        <div class="skills">
                            <div class="skill-item">
                                <div class="skill-label">
                                    <span>Speed</span>
                                    <span>${player.speed}%</span>
                                </div>
                                <div class="bar">
                                    <div class="bar-fill" style="width:${player.speed}%;"></div>
                                </div>
                            </div>
                            <div class="skill-item">
                                <div class="skill-label">
                                    <span>Skill</span>
                                    <span>${player.skill}%</span>
                                </div>
                                <div class="bar">
                                    <div class="bar-fill" style="width:${player.skill}%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="player-actions">
                            <button class="action-btn btn-primary" onclick="viewProfile('${player.name}')">
                                <i class='bx bx-user'></i> View Profile
                            </button>
                            <button class="action-btn btn-secondary" onclick="contactScout('${player.name}')">
                                <i class='bx bx-message-dots'></i> Contact
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            playerList.innerHTML = playerHTML;
        }

        function getPositionIcon(position) {
            const icons = {
                'Forward': 'target',
                'Striker': 'target',
                'Midfielder': 'trophy',
                'Defender': 'shield',
                'Winger': 'fast-forward',
                'Goalkeeper': 'shield-alt'
            };
            return icons[position] || 'football';
        }

        function searchPlayer() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();

            const filtered = players.filter(p =>
                p.name.toLowerCase().includes(query) ||
                p.club.toLowerCase().includes(query) ||
                p.position.toLowerCase().includes(query)
            );

            displayPlayers(filtered);
        }

        function viewProfile(name) {
            const player = players.find(p => p.name === name);
            if (player) {
                openProfileModal(player);
            }
        }

        function contactScout(name) {
            const player = players.find(p => p.name === name);
            if (player) {
                openContactModal(player);
            }
        }

        function openProfileModal(player) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="profile-modal">
                    <div class="modal-header-bar">
                        <h2>Player Profile</h2>
                        <i class='bx bx-x close-modal' onclick="this.closest('.modal-overlay').remove()"></i>
                    </div>
                    <div class="profile-content">
                        <div class="profile-image-section">
                            <img src="${player.image}" alt="${player.name}" class="profile-image">
                            <div class="profile-rating-large">${player.rating}</div>
                        </div>
                        <div class="profile-info-section">
                            <h2>${player.name}</h2>
                            <div class="profile-detail">
                                <i class='bx bx-calendar'></i>
                                <span>${player.age} years old</span>
                            </div>
                            <div class="profile-detail">
                                <i class='bx bx-football'></i>
                                <span>${player.club}</span>
                            </div>
                            <div class="profile-detail">
                                <i class='bx bx-target'></i>
                                <span>${player.position}</span>
                            </div>
                            
                            <div class="profile-stats-grid">
                                <div class="profile-stat-box">
                                    <i class='bx bx-target'></i>
                                    <span class="stat-value">${player.goals}</span>
                                    <span class="stat-label">Goals</span>
                                </div>
                                <div class="profile-stat-box">
                                    <i class='bx bx-share-alt'></i>
                                    <span class="stat-value">${player.assists}</span>
                                    <span class="stat-label">Assists</span>
                                </div>
                                <div class="profile-stat-box">
                                    <i class='bx bx-run'></i>
                                    <span class="stat-value">${player.speed}</span>
                                    <span class="stat-label">Speed</span>
                                </div>
                                <div class="profile-stat-box">
                                    <i class='bx bx-trophy'></i>
                                    <span class="stat-value">${player.skill}</span>
                                    <span class="stat-label">Skill</span>
                                </div>
                            </div>

                            <div class="profile-skills-detailed">
                                <h3>Detailed Skills</h3>
                                <div class="skill-item">
                                    <div class="skill-label">
                                        <span><i class='bx bx-run'></i> Speed & Agility</span>
                                        <span>${player.speed}%</span>
                                    </div>
                                    <div class="bar">
                                        <div class="bar-fill" style="width:${player.speed}%;"></div>
                                    </div>
                                </div>
                                <div class="skill-item">
                                    <div class="skill-label">
                                        <span><i class='bx bx-trophy'></i> Technical Skill</span>
                                        <span>${player.skill}%</span>
                                    </div>
                                    <div class="bar">
                                        <div class="bar-fill" style="width:${player.skill}%;"></div>
                                    </div>
                                </div>
                                <div class="skill-item">
                                    <div class="skill-label">
                                        <span><i class='bx bx-brain'></i> Game Intelligence</span>
                                        <span>${Math.round((player.rating / 10) * 100)}%</span>
                                    </div>
                                    <div class="bar">
                                        <div class="bar-fill" style="width:${(player.rating / 10) * 100}%;"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="profile-actions">
                                <button class="action-btn btn-primary" onclick="contactScout('${player.name}'); this.closest('.modal-overlay').remove();">
                                    <i class='bx bx-message-dots'></i> Contact Scout
                                </button>
                                <button class="action-btn btn-secondary" onclick="sharePlayer('${player.name}')">
                                    <i class='bx bx-share'></i> Share Profile
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function openContactModal(player) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="contact-modal">
                    <div class="modal-header-bar">
                        <h2>Contact Scout</h2>
                        <i class='bx bx-x close-modal' onclick="this.closest('.modal-overlay').remove()"></i>
                    </div>
                    <div class="contact-content">
                        <div class="contact-player-info">
                            <img src="${player.image}" alt="${player.name}" class="contact-player-image">
                            <div>
                                <h3>${player.name}</h3>
                                <p>${player.position} • ${player.club}</p>
                            </div>
                        </div>
                        
                        <form class="contact-form" onsubmit="sendContactMessage(event, '${player.name}')">
                            <div class="form-group">
                                <label><i class='bx bx-user'></i> Your Name</label>
                                <input type="text" required placeholder="Enter your full name">
                            </div>
                            <div class="form-group">
                                <label><i class='bx bx-envelope'></i> Email Address</label>
                                <input type="email" required placeholder="your.email@example.com">
                            </div>
                            <div class="form-group">
                                <label><i class='bx bx-phone'></i> Phone Number</label>
                                <input type="tel" required placeholder="+254 700 000 000">
                            </div>
                            <div class="form-group">
                                <label><i class='bx bx-briefcase'></i> Organization/Club</label>
                                <input type="text" required placeholder="Your club or organization">
                            </div>
                            <div class="form-group">
                                <label><i class='bx bx-message-detail'></i> Message</label>
                                <textarea required placeholder="Tell us about your interest in this player..." rows="4"></textarea>
                            </div>
                            <button type="submit" class="action-btn btn-primary full-width">
                                <i class='bx bx-send'></i> Send Message
                            </button>
                        </form>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function sendContactMessage(event, playerName) {
            event.preventDefault();
            const form = event.target;
            const formData = {
                name: form[0].value,
                email: form[1].value,
                phone: form[2].value,
                organization: form[3].value,
                message: form[4].value,
                player: playerName
            };
            
            showToast('✅ Message sent successfully! The scout will contact you soon.');
            form.closest('.modal-overlay').remove();
            console.log('Contact form data:', formData);
        }

        function sharePlayer(name) {
            const player = players.find(p => p.name === name);
            const shareText = `Check out ${player.name} - ${player.position} at ${player.club}! Rating: ${player.rating} ⚽`;
            
            if (navigator.share) {
                navigator.share({
                    title: `${player.name} - Player Profile`,
                    text: shareText,
                    url: window.location.href
                }).then(() => {
                    showToast('✅ Profile shared successfully!');
                }).catch(() => {
                    copyToClipboard(shareText);
                });
            } else {
                copyToClipboard(shareText);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            showToast('📋 Profile info copied to clipboard!');
        }

        function showNotifications() {
            showToast('🔔 No new notifications');
        }

        function openUploadModal() {
            showToast('📤 Upload modal opening...');
        }

        function performSearch() {
             showToast(`🔍 Search completed for: ${document.getElementById('searchInput').value}`);
        }
        
        function signIn() {
             showToast("👤 Sign-in functionality triggered!");
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #ff0000, #cc0000);
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                z-index: 10000;
                font-weight: 500;
                animation: fadeIn 0.3s ease;
                backdrop-filter: blur(10px);
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        displayPlayers(players);
        console.log("⚽ Scout Discovery page loaded with player images!");
    </script>

</body>
</html>
