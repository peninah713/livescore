<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Marketplace | LiveScore</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
:root {
    --primary-red: #D90D32;
    --navy-dark: #020F59;
    --blue: #023373;
    --blue-mid: #023E73;
    --light-gray: #F2F2F2;

    --bg1: var(--navy-dark);
    --bg2: var(--blue-mid);
    --accent: var(--primary-red);

    --card-bg: rgba(255,255,255,0.06);
    --text: #ffffff;
    --muted: #d9dbe3;
}

/* GLOBAL */
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #020F59 0%, #023373 50%, #023E73 100%);
    color: var(--text);
    min-height: 100vh;
}

/* ===== STICKY HEADER ===== */
.top-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 15px 25px;
    background: linear-gradient(135deg, #020F59 0%, #023373 100%);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 25px rgba(0,0,0,0.35);
    position: sticky;
    top: 0;
    z-index: 2000;
}

/* LOGO */
.logo {
    font-weight: bold;
    font-size: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    white-space: nowrap;
}

/* NAVIGATION */
.nav-links {
    display: flex;
    gap: 2px;
    flex: 1;
}

.nav-link {
    padding: 14px 20px;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s ease;
    white-space: nowrap;
}

.nav-link:hover {
    background: rgba(217, 13, 50, 0.15);
    color: var(--text);
}

.nav-link.active {
    color: #D90D32;
    background: rgba(217, 13, 50, 0.18);
    font-weight: 700;
}

/* Replace your existing .search-bar styles with this */
.search-bar {
    position: relative;
    display: flex;
    align-items: center;
    max-width: 500px;
    flex: 1;
}

.search-bar input {
    padding: 12px 50px 12px 45px;
    border-radius: 25px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 14px;
    width: 100%;
    transition: 0.3s ease;
}

.search-bar input:focus {
    background: rgba(255,255,255,0.25);
    outline: none;
}

.search-bar input::placeholder {
    color: rgba(255,255,255,0.7);
}

.search-icon {
    position: absolute;
    left: 15px;
    color: rgba(255,255,255,0.8);
    font-size: 20px;
    pointer-events: none;
}

.search-btn {
    position: absolute;
    right: 5px;
    background: #D90D32;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s ease;
}

.search-btn i {
    color: white;
    font-size: 18px;
}

.search-btn:hover {
    background: #B50B28;
    transform: scale(1.05);
}

/* TOP ICONS */
.top-icons {
    display: flex;
    gap: 15px;
    align-items: center;
}

.top-icons i {
    font-size: 22px;
    cursor: pointer;
    transition: 0.3s ease;
    color: rgba(255,255,255,0.8);
}

.top-icons i:hover {
    color: #D90D32;
}

/* HERO SECTION */
.hero {
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, rgba(2,15,89,0.8) 0%, rgba(2,51,115,0.6) 100%);
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
    color: #ffffff;
}

.hero p {
    font-size: 20px;
    color: var(--muted);
}

/* STATS BAR */
.stats-bar {
    display: flex;
    justify-content: space-around;
    padding: 30px 20px;
    background: rgba(2,15,89,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.stat-item {
    text-align: center;
}

.stat-item .number {
    font-size: 32px;
    font-weight: bold;
    color: #D90D32;
    margin-bottom: 8px;
}

.stat-item .label {
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* FILTERS */
.filters {
    display: flex;
    gap: 15px;
    padding: 30px 25px;
    flex-wrap: wrap;
    justify-content: center;
}

.filter-btn {
    padding: 12px 24px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.filter-btn:hover {
    background: rgba(217,13,50,0.2);
    border-color: #D90D32;
}

.filter-btn.active {
    background: linear-gradient(135deg, #D90D32, #B50B28);
    border-color: #D90D32;
}

/* CONTAINER */
.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 25px;
}

/* SPONSOR CARDS */
.sponsor-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 30px;
}

.card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    transition: 0.3s ease;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #D90D32, #B50B28);
}

.card:hover {
    transform: translateY(-10px);
    border-color: #D90D32;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 15px;
}

.card-header h3 {
    font-size: 22px;
    color: white;
    margin-bottom: 8px;
}

.badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
}

.badge.club {
    background: rgba(217,13,50,0.2);
    color: #D90D32;
    border: 1px solid rgba(217,13,50,0.4);
}

.badge.event {
    background: rgba(2,51,115,0.3);
    color: #4A9FFF;
    border: 1px solid rgba(74,159,255,0.4);
}

.badge.player {
    background: rgba(2,62,115,0.3);
    color: #6BB6FF;
    border: 1px solid rgba(107,182,255,0.4);
}

.card p {
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
}

/* METRICS */
.metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin: 20px 0;
}

.metric {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.metric span {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.metric strong {
    font-size: 16px;
    color: white;
}

/* TAGS */
.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
}

.tags span {
    padding: 6px 12px;
    background: rgba(217, 13, 50, 0.2);
    border: 1px solid rgba(217, 13, 50, 0.35);
    color: #D90D32;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

.btn-primary,
.btn-outline {
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex: 1;
}

.btn-primary {
    background: linear-gradient(135deg, #D90D32, #B50B28);
    color: white;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #B50B28, #8F0920);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(217,13,50,0.4);
}

.btn-outline {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.3);
    color: white;
}

.btn-outline:hover {
    border-color: #D90D32;
    background: rgba(217,13,50,0.1);
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 3000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
}

.modal.active {
    display: flex;
}

.modal-content {
    background: linear-gradient(135deg, #020F59 0%, #023373 100%);
    border-radius: 20px;
    padding: 35px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 50px rgba(0,0,0,0.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.modal-title {
    font-size: 28px;
    color: white;
}

.close-btn {
    background: none;
    border: none;
    font-size: 32px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: 0.3s ease;
    padding: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-btn:hover {
    color: #D90D32;
}

.detail-section {
    margin-bottom: 25px;
}

.detail-section h4 {
    font-size: 18px;
    color: #D90D32;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.detail-label {
    color: rgba(255,255,255,0.6);
    font-weight: 500;
}

.detail-value {
    color: white;
    font-weight: 600;
}

/* EMPTY STATE */
.empty-state {
    text-align: center;
    padding: 80px 20px;
    grid-column: 1 / -1;
}

.empty-state i {
    font-size: 80px;
    color: rgba(255,255,255,0.2);
    margin-bottom: 20px;
}

.empty-state h3 {
    font-size: 24px;
    color: white;
    margin-bottom: 10px;
}

.empty-state p {
    color: var(--muted);
}

/* ANIMATIONS */
@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* SCROLLBAR */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: rgba(2,15,89,0.3);
}

::-webkit-scrollbar-thumb {
    background: rgba(217,13,50,0.6);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: #D90D32;
}  
        /* ===== RESPONSIVE MEDIA QUERIES ===== */

/* Large Desktop (1400px and above) */
@media (min-width: 1400px) {
    .container {
        max-width: 1600px;
    }
    
    .sponsor-cards {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* Desktop (1200px - 1399px) */
@media (max-width: 1399px) {
    .sponsor-cards {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* Desktop (992px - 1199px) */
@media (max-width: 1199px) {
    .hero h1 {
        font-size: 42px;
    }
    
    .hero p {
        font-size: 18px;
    }
    
    .sponsor-cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }
    
    .nav-link {
        padding: 12px 16px;
        font-size: 14px;
    }
}

        font-size: 13px;
    }

        order: 1;
        position: absolute;
        top: 15px;
        right: 20px;
    }
    
    .hero {
        padding: 50px 20px;
    }
    
    .hero h1 {
        font-size: 36px;
    }
    
    .hero p {
        font-size: 16px;
    }

    }
    
    .stat-item {

    }
    
    .stat-item .number {

/* Landscape orientation adjustments */

    .hero {

    }

    }
    
    .stats-bar {
        flex-direction: row;
        padding: 20px 15px;
    }
    
    .stat-item {
        width: 25%;
        margin-bottom: 0;
    }
    
    .modal-content {
        max-height: 90vh;
    }
}

/* Very small screens in portrait */
@media (max-width: 360px) {
    .logo {
        font-size: 15px;
    }
    
    .hero h1 {
        font-size: 22px;
    }
    
    .hero p {
        font-size: 12px;
    }
    
    .nav-link {
        padding: 5px 6px;
        font-size: 9px;
    }
    
    .filter-btn {
        padding: 6px 10px;
        font-size: 10px;
    }
    
    .card-header h3 {
        font-size: 15px;
    }
    
    .stat-item .number {
        font-size: 20px;
    }
}
    </style>
</head>
<body>

   <header class="top-bar">
    <div class="logo">⚽ LiveScore</div>
     
<div class="search-bar">
    <i class='bx bx-search search-icon'></i>
    <input type="text" id="searchInput" placeholder="Search football highlights...">
    <button class="search-btn">
        <i class='bx bx-search'></i>
    </button>
</div>
  <!-- Add this to your nav-links div -->
<div class="nav-links">
    <a href="home.html" class="nav-link">Home</a>
    <a href="highlights.html" class="nav-link">Highlights</a>
    <a href="events.html" class="nav-link">Events</a>
    <a href="players.html" class="nav-link">Players</a>
    <a href="sponsors.html" class="nav-link active">Sponsors</a>
    <a href="search.html" class="nav-link">Search</a> <!-- ADD THIS LINE -->
</div>
   
    
    <div class="top-icons">
        <i class='bx bx-bell' title="Notifications"></i>
    </div>
</header>

    <div class="hero">
        <h1>Sponsor Marketplace</h1>
        <p>Connect with clubs, events, and athletes seeking sponsorships</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="number" id="totalOpportunities">0</div>
            <div class="label">Total Opportunities</div>
        </div>
        <div class="stat-item">
            <div class="number">$2.5M+</div>
            <div class="label">Total Budget Pool</div>
        </div>
        <div class="stat-item">
            <div class="number">1.2M+</div>
            <div class="label">Combined Reach</div>
        </div>
        <div class="stat-item">
            <div class="number" id="activeFilters">All</div>
            <div class="label">Current Filter</div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all" onclick="filterByType('all')">
            <i class='bx bx-grid-alt'></i> All
        </button>
        <button class="filter-btn" data-filter="Club" onclick="filterByType('Club')">
            <i class='bx bx-football'></i> Clubs
        </button>
        <button class="filter-btn" data-filter="Event" onclick="filterByType('Event')">
            <i class='bx bx-calendar-event'></i> Events
        </button>
        <button class="filter-btn" data-filter="Player" onclick="filterByType('Player')">
            <i class='bx bx-user'></i> Players
        </button>
    </div>

    <div class="container">
        <div class="sponsor-cards" id="sponsorList"></div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Opportunity Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button class="btn-outline" style="flex: 1;" onclick="closeModal()">Close</button>
                <button class="btn-primary" style="flex: 2;" onclick="expressInterestFromModal()">
                    <i class="fa-solid fa-handshake"></i> Express Interest
                </button>
            </div>
        </div>
    </div>

    <script>
        const opportunities = [
            { name: "Gor Mahia FC", type: "Club", desc: "Premier League club seeking jersey sponsor for 2024/25 season. Strong fanbase across East Africa with championship-winning track record.", reach: "500K", budget: "$50K - $100K", location: "Nairobi", tags: ["Premier League", "Fanbase", "Champions"], duration: "1 year", contact: "sponsors@gormahia.co.ke" },
            { name: "Nairobi Youth Tournament", type: "Event", desc: "Annual youth tournament featuring 32 teams from across the region. Great community engagement opportunity.", reach: "150K", budget: "$10K - $25K", location: "Nairobi", tags: ["Youth", "Community", "Grassroots"], duration: "3 months", contact: "info@nairobiyouth.org" },
            { name: "James Ochieng", type: "Player", desc: "Rising star forward seeking personal brand sponsors. Currently top scorer in the league with strong social media presence.", reach: "45K", budget: "$5K - $15K", location: "Nairobi", tags: ["Rising Star", "Brand", "Social Media"], duration: "6 months", contact: "james.ochieng@sports.com" },
            { name: "AFC Leopards", type: "Club", desc: "Historic club seeking stadium naming rights partner. One of Kenya's most beloved teams with over 50 years of history.", reach: "450K", budget: "$75K - $150K", location: "Nairobi", tags: ["Historic", "Naming Rights", "Legacy"], duration: "3 years", contact: "commercial@afcleopards.com" },
            { name: "Mombasa Beach Soccer", type: "Event", desc: "Unique beach soccer event with high visibility along the coast. Perfect for tourism and lifestyle brands.", reach: "80K", budget: "$8K - $20K", location: "Mombasa", tags: ["Tourism", "Beach Soccer", "Coastal"], duration: "1 month", contact: "mombasa@beachsoccer.co.ke" },
            { name: "Tusker FC", type: "Club", desc: "Top-tier club with consistent performance seeking kit sponsor. Multiple championship wins and continental experience.", reach: "380K", budget: "$40K - $80K", location: "Nairobi", tags: ["Premier League", "Champions", "Performance"], duration: "2 years", contact: "partnerships@tuskerfc.com" },
            { name: "Women's League Finals", type: "Event", desc: "Championship finals of the women's football league. Growing audience and strong community support.", reach: "120K", budget: "$15K - $30K", location: "Kisumu", tags: ["Women's Sports", "Finals", "Growing"], duration: "2 weeks", contact: "womens@league.co.ke" },
            { name: "Sarah Mwangi", type: "Player", desc: "National team midfielder with international experience. Looking for equipment and personal brand sponsorship.", reach: "65K", budget: "$8K - $18K", location: "Nairobi", tags: ["National Team", "Midfielder", "International"], duration: "1 year", contact: "sarah.mwangi@pro.com" }
        ];

        const sponsorList = document.getElementById("sponsorList");
        const searchInput = document.getElementById("searchInput");
        let currentFilter = "all";
        let currentOpportunity = null;

        function displaySponsors(list) {
            if (list.length === 0) {
                sponsorList.innerHTML = `
                    <div class="empty-state">
                        <i class='bx bx-search-alt'></i>
                        <h3>No opportunities found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }

            const sponsorHTML = list.map(o => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h3>${o.name}</h3>
                            <div class="badge ${o.type.toLowerCase()}">${o.type}</div>
                        </div>
                    </div>
                    <p>${o.desc}</p>
                    <div class="metrics">
                        <div class="metric"><span>Reach</span><strong>${o.reach}</strong></div>
                        <div class="metric"><span>Budget</span><strong>${o.budget}</strong></div>
                        <div class="metric"><span>Location</span><strong>${o.location}</strong></div>
                        <div class="metric"><span>Duration</span><strong>${o.duration}</strong></div>
                    </div>
                    <div class="tags">${o.tags.map(tag => `<span>${tag}</span>`).join("")}</div>
                    <div class="buttons">
                        <button class="btn-primary" onclick='expressInterest("${o.name}")'>
                            <i class="fa-solid fa-handshake"></i> Express Interest
                        </button>
                        <button class="btn-outline" onclick='viewDetails("${o.name}")'>
                            <i class="fa-solid fa-eye"></i> Details
                        </button>
                    </div>
                </div>
            `).join('');

            sponsorList.innerHTML = sponsorHTML;
            document.getElementById('totalOpportunities').textContent = list.length;
        }

        function searchSponsor() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = opportunities;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(o => o.type === currentFilter);
            }

            if (query) {
                filtered = filtered.filter(o => 
                    o.name.toLowerCase().includes(query) ||
                    o.type.toLowerCase().includes(query) ||
                    o.location.toLowerCase().includes(query) ||
                    o.desc.toLowerCase().includes(query) ||
                    o.tags.some(tag => tag.toLowerCase().includes(query))
                );
            }

            displaySponsors(filtered);
        }

        function filterByType(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.filter-btn').classList.add('active');
            document.getElementById('activeFilters').textContent = type === 'all' ? 'All' : type + 's';
            searchSponsor();
        }

        function viewDetails(name) {
            currentOpportunity = opportunities.find(o => o.name === name);
            if (!currentOpportunity) return;

            document.getElementById('modalTitle').textContent = currentOpportunity.name;
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <h4>Overview</h4>
                    <p style="color: var(--muted); line-height: 1.6;">${currentOpportunity.desc}</p>
                </div>
                <div class="detail-section">
                    <h4>Key Metrics</h4>
                    <div class="detail-row">
                        <span class="detail-label">Type</span>
                        <span class="detail-value">${currentOpportunity.type}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Audience Reach</span>
                        <span class="detail-value">${currentOpportunity.reach}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Budget Range</span>
                        <span class="detail-value">${currentOpportunity.budget}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Location</span>
                        <span class="detail-value">${currentOpportunity.location}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Duration</span>
                        <span class="detail-value">${currentOpportunity.duration}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Contact</span>
                        <span class="detail-value">${currentOpportunity.contact}</span>
                    </div>
                </div>
                <div class="detail-section">
                    <h4>Categories</h4>
                    <div class="tags">${currentOpportunity.tags.map(tag => `<span>${tag}</span>`).join("")}</div>
                </div>
            `;
            document.getElementById('detailsModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function expressInterest(name) {
            const opp = opportunities.find(o => o.name === name);
            showToast(`🤝 Interest expressed for ${name}! We'll contact you at ${opp.contact}`);
        }

        function expressInterestFromModal() {
            if (currentOpportunity) {
                expressInterest(currentOpportunity.name);
                closeModal();
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #4CAF50, #45a049);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                z-index: 3000;
                font-weight: 500;
                animation: slideIn 0.3s ease;
                max-width: 400px;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 4000);
        }

        searchInput.addEventListener('input', searchSponsor);
        
        window.addEventListener('click', (e) => {
            if (e.target.id === 'detailsModal') closeModal();
        });

        displaySponsors(opportunities);
    </script>
</body>
</html>
