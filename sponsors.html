<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Marketplace | LiveScore</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
:root {
    --primary-red: #D90D32;
    --navy-dark: #020F59;
    --blue: #023373;
    --blue-mid: #023E73;
    --light-gray: #F2F2F2;

    --bg1: var(--navy-dark);
    --bg2: var(--blue-mid);
    --accent: var(--primary-red);

    --card-bg: rgba(255,255,255,0.06);
    --text: #ffffff;
    --muted: #d9dbe3;
}

/* GLOBAL */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--blue) 50%, var(--blue-mid) 100%);
    color: var(--text);
    min-height: 100vh;
}

/* ===== HEADER (Improved Sticky Look) ===== */
.top-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 15px 25px;
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--blue) 100%);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 25px rgba(0,0,0,0.35);
    position: sticky;
    top: 0;
    z-index: 2000;
}

/* LOGO */
.logo {
    font-weight: bold;
    font-size: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    white-space: nowrap;
}

/* NAVIGATION */
.nav-links {
    display: flex;
    gap: 2px;
    flex: 1;
}

.nav-link {
    padding: 14px 20px;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s ease;
    white-space: nowrap;
}

.nav-link:hover {
    background: rgba(217, 13, 50, 0.15);
    color: var(--text);
}

.nav-link.active {
    color: var(--primary-red);
    background: rgba(217, 13, 50, 0.18);
    font-weight: 700;
}

/* SEARCH BAR */
.search-bar input {
    background: rgba(255,255,255,0.1);
}
.search-bar input:focus {
    background: rgba(255,255,255,0.18);
    border-color: var(--primary-red);
}

/* ===== CARDS (Made slightly bigger) ===== */
.sponsor-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 30px;
}

.card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-10px);
    border-color: var(--primary-red);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.card::before {
    background: linear-gradient(90deg, var(--primary-red), #B50B28);
}

/* BUTTONS */
.btn-primary {
    background: linear-gradient(135deg, var(--primary-red), #B50B28);
    color: white;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #B50B28, #8F0920);
}

.tags span {
    background: rgba(217, 13, 50, 0.2);
    border: 1px solid rgba(217, 13, 50, 0.35);
    color: var(--primary-red);
}

   
    </style>
</head>
<body>

   <header class="top-bar">
    <div class="logo">⚽ LiveScore</div>
    
    <div class="nav-links">
        <a href="home.html" class="nav-link">Home</a>
        <a href="highlights.html" class="nav-link">Highlights</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="players.html" class="nav-link">Players</a>
        <a href="sponsors.html" class="nav-link active">Sponsors</a>
      
    </div>
    
    <div class="search-bar">
        <i class='bx bx-search search-icon'></i>
        <input type="text" id="searchInput" placeholder="Search sponsorships...">
    </div>
    
    <div class="top-icons">
        <i class='bx bx-bell' title="Notifications"></i>
    </div>
</header>

    <div class="hero">
        <h1>Sponsor Marketplace</h1>
        <p>Connect with clubs, events, and athletes seeking sponsorships</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="number" id="totalOpportunities">0</div>
            <div class="label">Total Opportunities</div>
        </div>
        <div class="stat-item">
            <div class="number">$2.5M+</div>
            <div class="label">Total Budget Pool</div>
        </div>
        <div class="stat-item">
            <div class="number">1.2M+</div>
            <div class="label">Combined Reach</div>
        </div>
        <div class="stat-item">
            <div class="number" id="activeFilters">All</div>
            <div class="label">Current Filter</div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all" onclick="filterByType('all')">
            <i class='bx bx-grid-alt'></i> All
        </button>
        <button class="filter-btn" data-filter="Club" onclick="filterByType('Club')">
            <i class='bx bx-football'></i> Clubs
        </button>
        <button class="filter-btn" data-filter="Event" onclick="filterByType('Event')">
            <i class='bx bx-calendar-event'></i> Events
        </button>
        <button class="filter-btn" data-filter="Player" onclick="filterByType('Player')">
            <i class='bx bx-user'></i> Players
        </button>
    </div>

    <div class="container">
        <div class="sponsor-cards" id="sponsorList"></div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Opportunity Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button class="btn-outline" style="flex: 1;" onclick="closeModal()">Close</button>
                <button class="btn-primary" style="flex: 2;" onclick="expressInterestFromModal()">
                    <i class="fa-solid fa-handshake"></i> Express Interest
                </button>
            </div>
        </div>
    </div>

    <script>
        const opportunities = [
            { name: "Gor Mahia FC", type: "Club", desc: "Premier League club seeking jersey sponsor for 2024/25 season. Strong fanbase across East Africa with championship-winning track record.", reach: "500K", budget: "$50K - $100K", location: "Nairobi", tags: ["Premier League", "Fanbase", "Champions"], duration: "1 year", contact: "sponsors@gormahia.co.ke" },
            { name: "Nairobi Youth Tournament", type: "Event", desc: "Annual youth tournament featuring 32 teams from across the region. Great community engagement opportunity.", reach: "150K", budget: "$10K - $25K", location: "Nairobi", tags: ["Youth", "Community", "Grassroots"], duration: "3 months", contact: "info@nairobiyouth.org" },
            { name: "James Ochieng", type: "Player", desc: "Rising star forward seeking personal brand sponsors. Currently top scorer in the league with strong social media presence.", reach: "45K", budget: "$5K - $15K", location: "Nairobi", tags: ["Rising Star", "Brand", "Social Media"], duration: "6 months", contact: "james.ochieng@sports.com" },
            { name: "AFC Leopards", type: "Club", desc: "Historic club seeking stadium naming rights partner. One of Kenya's most beloved teams with over 50 years of history.", reach: "450K", budget: "$75K - $150K", location: "Nairobi", tags: ["Historic", "Naming Rights", "Legacy"], duration: "3 years", contact: "commercial@afcleopards.com" },
            { name: "Mombasa Beach Soccer", type: "Event", desc: "Unique beach soccer event with high visibility along the coast. Perfect for tourism and lifestyle brands.", reach: "80K", budget: "$8K - $20K", location: "Mombasa", tags: ["Tourism", "Beach Soccer", "Coastal"], duration: "1 month", contact: "mombasa@beachsoccer.co.ke" },
            { name: "Tusker FC", type: "Club", desc: "Top-tier club with consistent performance seeking kit sponsor. Multiple championship wins and continental experience.", reach: "380K", budget: "$40K - $80K", location: "Nairobi", tags: ["Premier League", "Champions", "Performance"], duration: "2 years", contact: "partnerships@tuskerfc.com" },
            { name: "Women's League Finals", type: "Event", desc: "Championship finals of the women's football league. Growing audience and strong community support.", reach: "120K", budget: "$15K - $30K", location: "Kisumu", tags: ["Women's Sports", "Finals", "Growing"], duration: "2 weeks", contact: "womens@league.co.ke" },
            { name: "Sarah Mwangi", type: "Player", desc: "National team midfielder with international experience. Looking for equipment and personal brand sponsorship.", reach: "65K", budget: "$8K - $18K", location: "Nairobi", tags: ["National Team", "Midfielder", "International"], duration: "1 year", contact: "sarah.mwangi@pro.com" }
        ];

        const sponsorList = document.getElementById("sponsorList");
        const searchInput = document.getElementById("searchInput");
        let currentFilter = "all";
        let currentOpportunity = null;

        function displaySponsors(list) {
            if (list.length === 0) {
                sponsorList.innerHTML = `
                    <div class="empty-state">
                        <i class='bx bx-search-alt'></i>
                        <h3>No opportunities found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }

            const sponsorHTML = list.map(o => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h3>${o.name}</h3>
                            <div class="badge ${o.type.toLowerCase()}">${o.type}</div>
                        </div>
                    </div>
                    <p>${o.desc}</p>
                    <div class="metrics">
                        <div class="metric"><span>Reach</span><strong>${o.reach}</strong></div>
                        <div class="metric"><span>Budget</span><strong>${o.budget}</strong></div>
                        <div class="metric"><span>Location</span><strong>${o.location}</strong></div>
                        <div class="metric"><span>Duration</span><strong>${o.duration}</strong></div>
                    </div>
                    <div class="tags">${o.tags.map(tag => `<span>${tag}</span>`).join("")}</div>
                    <div class="buttons">
                        <button class="btn-primary" onclick='expressInterest("${o.name}")'>
                            <i class="fa-solid fa-handshake"></i> Express Interest
                        </button>
                        <button class="btn-outline" onclick='viewDetails("${o.name}")'>
                            <i class="fa-solid fa-eye"></i> Details
                        </button>
                    </div>
                </div>
            `).join('');

            sponsorList.innerHTML = sponsorHTML;
            document.getElementById('totalOpportunities').textContent = list.length;
        }

        function searchSponsor() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = opportunities;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(o => o.type === currentFilter);
            }

            if (query) {
                filtered = filtered.filter(o => 
                    o.name.toLowerCase().includes(query) ||
                    o.type.toLowerCase().includes(query) ||
                    o.location.toLowerCase().includes(query) ||
                    o.desc.toLowerCase().includes(query) ||
                    o.tags.some(tag => tag.toLowerCase().includes(query))
                );
            }

            displaySponsors(filtered);
        }

        function filterByType(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.filter-btn').classList.add('active');
            document.getElementById('activeFilters').textContent = type === 'all' ? 'All' : type + 's';
            searchSponsor();
        }

        function viewDetails(name) {
            currentOpportunity = opportunities.find(o => o.name === name);
            if (!currentOpportunity) return;

            document.getElementById('modalTitle').textContent = currentOpportunity.name;
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <h4>Overview</h4>
                    <p style="color: var(--muted); line-height: 1.6;">${currentOpportunity.desc}</p>
                </div>
                <div class="detail-section">
                    <h4>Key Metrics</h4>
                    <div class="detail-row">
                        <span class="detail-label">Type</span>
                        <span class="detail-value">${currentOpportunity.type}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Audience Reach</span>
                        <span class="detail-value">${currentOpportunity.reach}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Budget Range</span>
                        <span class="detail-value">${currentOpportunity.budget}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Location</span>
                        <span class="detail-value">${currentOpportunity.location}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Duration</span>
                        <span class="detail-value">${currentOpportunity.duration}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Contact</span>
                        <span class="detail-value">${currentOpportunity.contact}</span>
                    </div>
                </div>
                <div class="detail-section">
                    <h4>Categories</h4>
                    <div class="tags">${currentOpportunity.tags.map(tag => `<span>${tag}</span>`).join("")}</div>
                </div>
            `;
            document.getElementById('detailsModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function expressInterest(name) {
            const opp = opportunities.find(o => o.name === name);
            showToast(`🤝 Interest expressed for ${name}! We'll contact you at ${opp.contact}`);
        }

        function expressInterestFromModal() {
            if (currentOpportunity) {
                expressInterest(currentOpportunity.name);
                closeModal();
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #4CAF50, #45a049);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                z-index: 3000;
                font-weight: 500;
                animation: slideIn 0.3s ease;
                max-width: 400px;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 4000);
        }

        searchInput.addEventListener('input', searchSponsor);
        
        window.addEventListener('click', (e) => {
            if (e.target.id === 'detailsModal') closeModal();
        });

        displaySponsors(opportunities);
    </script>
</body>
</html>
